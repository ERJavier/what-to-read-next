name: Lint and Format

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: |
          ruff check api/ etl/ scripts/ || echo "Ruff found issues (non-blocking)"

      - name: Check Black formatting
        run: |
          black --check api/ etl/ scripts/ || echo "Black formatting check failed (non-blocking)"

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8 --activate

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run type check
        working-directory: ./frontend
        run: pnpm check
        continue-on-error: true

      - name: Check for ESLint (if configured)
        working-directory: ./frontend
        run: |
          if [ -f .eslintrc* ] || [ -f eslint.config.* ] || [ -f package.json ] && grep -q "eslint" package.json; then
            echo "ESLint configuration found"
            # Add ESLint check here when configured
          else
            echo "ESLint not configured yet"
          fi
