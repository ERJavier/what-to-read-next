name: Docker Build

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
    paths:
      - 'Dockerfile.*'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'api/**'
      - 'etl/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile.*'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'api/**'
      - 'etl/**'
      - '.github/workflows/docker-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - name: api
            file: Dockerfile.api
            context: .
          - name: etl
            file: Dockerfile.etl
            context: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        timeout-minutes: 30
        with:
          context: ${{ matrix.dockerfile.context }}
          file: ${{ matrix.dockerfile.file }}
          push: false
          tags: whattoread-${{ matrix.dockerfile.name }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: |
          if docker images | grep -q "whattoread-${{ matrix.dockerfile.name }}:test"; then
            echo "✓ Docker image built successfully"
          else
            echo "✗ Docker image not found"
            exit 1
          fi
